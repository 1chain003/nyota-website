<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Details - Nyota</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main style="max-width:700px;margin:50px auto;padding:20px;">
<h1>Account Details</h1>
<p>Update your details before applying for opportunities.</p>
<form id="accountForm">
<label>Name</label>
<input type="text" id="name" required>
<label>Email</label>
<input type="email" id="email" readonly>
<label>Phone Number</label>
<input type="text" id="phone" required>
<label>Kenyan National ID Number</label>
<input type="text" id="idNumber" required>
<label>City</label>
<input type="text" id="city" required>
<label>Postal Code</label>
<input type="text" id="postalCode" required>
<button type="submit" class="btn primary">Save Account Details</button>
</form>
<p id="message"></p>
<p><a href="index.html">Back to Home</a></p>
</main>
<script>
async function loadProfile() {
    const response = await fetch('/api/me');

    if (response.ok === false) {
        window.location.href = 'member-login.html';
        return;
    }

    const data = await response.json();
    const user = data.user;

    document.getElementById('name').value = user.name || '';
    document.getElementById('email').value = user.email || '';
    document.getElementById('phone').value = user.phone || '';
    document.getElementById('idNumber').value = user.idNumber || '';
    document.getElementById('city').value = user.city || '';
    document.getElementById('postalCode').value = user.postalCode || '';
}

document.getElementById('accountForm').addEventListener('submit', async function(event) {
    event.preventDefault();

    const message = document.getElementById('message');
    message.textContent = 'Saving...';

    const response = await fetch('/api/update-profile', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            idNumber: document.getElementById('idNumber').value.trim(),
            city: document.getElementById('city').value.trim(),
            postalCode: document.getElementById('postalCode').value.trim()
        })
    });

    const data = await response.json();
    message.textContent = data.message;

    if (data.success === true) {
        setTimeout(function() {
            window.location.href = 'index.html';
        }, 1000);
    }
});

loadProfile();
</script>
