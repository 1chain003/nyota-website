<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biashara Loan Application</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f5;margin:0;padding:20px}
.container{max-width:520px;margin:60px auto;background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
h1{text-align:center;color:#16833a}
.notice{background:#e8f5e9;padding:15px;border-radius:8px;margin-bottom:20px}
label{display:block;margin-top:15px;font-weight:bold}
input,textarea{width:100%;box-sizing:border-box;padding:12px;margin-top:7px;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{width:100%;padding:14px;margin-top:25px;background:#16833a;color:white;border:0;border-radius:7px;font-size:17px;cursor:pointer}
button:disabled{background:#999}
.message{margin-top:15px;text-align:center;font-weight:bold}
</style>
</head>
<body>

<div class="container">
<h1>Biashara Loan Application</h1>

<div class="notice">
<strong>Loan amount:</strong> KSh 24,000 – KSh 80,000
</div>

<form id="loanForm" enctype="multipart/form-data">

<label for="idNumber">ID Number</label>
<input type="text" id="idNumber" name="idNumber">

<label for="fullName">Full Name</label>
<input type="text" id="fullName" name="fullName" readonly>

<label for="phone">Phone Number</label>
<input type="text" id="phone" name="phone" readonly>

<label for="email">Email Address</label>
<input type="email" id="email" name="email" readonly>

<label for="amount">Loan Amount (KSh)</label>
<input type="number" id="amount" name="amount" min="24000" max="80000" required>

<label for="purpose">Purpose of the Loan</label>
<textarea id="purpose" name="purpose" rows="5" minlength="200" required></textarea>

<label for="disbursementAccountType">Loan Disbursement Account</label>
<select id="disbursementAccountType" name="disbursementAccountType" required>
    <option value="">Select account type</option>
    <option value="M-Pesa">M-Pesa</option>
    <option value="Bank Account">Bank Account</option>
</select>

<label for="disbursementAccountNumber">Account Number</label>
<input type="text" id="disbursementAccountNumber" name="disbursementAccountNumber" required>

<label for="idFront">ID Photo – Front</label>
<input type="file" id="idFront" name="idFront" accept="image/jpeg,image/png,image/webp" required>

<label for="idBack">ID Photo – Back</label>
<input type="file" id="idBack" name="idBack" accept="image/jpeg,image/png,image/webp" required>

<button type="submit" id="submitBtn">Submit Application</button>

<div class="message" id="message"></div>

</form>
</div>

<script>
document.addEventListener("DOMContentLoaded", async function() {
    const form = document.getElementById("loanForm");
    const message = document.getElementById("message");

    if (!form) {
        return;
    }

    try {
        const response = await fetch("/api/me");
        const data = await response.json();

        if (!response.ok || !data.success) {
            window.location.href = "/member-login.html";
            return;
        }

        document.getElementById("fullName").value = data.user.name || "";
        document.getElementById("phone").value = data.user.phone || "";
        document.getElementById("email").value = data.user.email || "";
    } catch (error) {
        console.error("Account loading error:", error);
    }

    form.addEventListener("submit", async function(e) {
        e.preventDefault();

        message.textContent = "";

        const idNumber = document.getElementById("idNumber").value.trim();
        const amount = Number(document.getElementById("amount").value);
        const purpose = document.getElementById("purpose").value.trim();
        const disbursementAccountType = document.getElementById("disbursementAccountType").value;
        const disbursementAccountNumber = document.getElementById("disbursementAccountNumber").value.trim();
        const idFront = document.getElementById("idFront").files[0];
        const idBack = document.getElementById("idBack").files[0];

        if (!idNumber) {
            message.textContent = "Please enter your ID Number.";
            return;
        }

        if (!Number.isInteger(amount)) {
            message.textContent = "Please enter a valid loan amount.";
            return;
        }

        if (amount < 24000) {
            message.textContent = "Loan amount cannot be less than KSh 24,000.";
            return;
        }

        if (amount > 80000) {
            message.textContent = "Loan amount cannot exceed KSh 80,000.";
            return;
        }

        if (!purpose) {
            message.textContent = "Please provide the purpose of the loan.";
            return;
        }

        if (!idFront || !idBack) {
            message.textContent = "Please select both front and back ID photos.";
            return;
        }

        const formData = new FormData();
        formData.append("idNumber", idNumber);
        formData.append("fullName", document.getElementById("fullName").value);
        formData.append("phone", document.getElementById("phone").value);
        formData.append("email", document.getElementById("email").value);
        formData.append("amount", amount);
        formData.append("purpose", purpose);
        formData.append("disbursementAccountType", disbursementAccountType);
        formData.append("disbursementAccountNumber", disbursementAccountNumber);
        formData.append("idFront", idFront);
        formData.append("idBack", idBack);
        formData.append("loanType", "Biashara Loan");

        const button = document.getElementById("submitBtn");
        button.disabled = true;
        message.textContent = "Submitting application...";

        try {
            const response = await fetch("/api/loan-applications", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (response.ok && data.success) {
                message.textContent = "Your Biashara Loan application has been received successfully. We are reviewing your application and we will get back to you within the next 3 business days through the email/phone you have registered with.";
                form.reset();
            } else {
                message.textContent = data.message || "Application failed.";
            }
        } catch (error) {
            console.error("Loan submission error:", error);
            message.textContent = "Unable to submit application. Please try again.";
        }

        button.disabled = false;
    });
});
</script>

</body>
</html>
