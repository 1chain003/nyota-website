<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NYOTA Admin</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:420px;margin:70px auto;padding:25px"><h1>NYOTA Admin</h1><form id="f"><p><input id="e" type="email" placeholder="Admin email" required style="width:100%;padding:12px;box-sizing:border-box"></p><p><input id="p" type="password" placeholder="Password" required style="width:100%;padding:12px;box-sizing:border-box"></p><button type="submit" style="width:100%;padding:13px">Login</button><p id="x"></p></form></main><script>f.onsubmit=async a=>{a.preventDefault();x.textContent="Logging in...";try{let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:e.value,password:p.value})}),d=await r.json();if(d.success)location="/admin-dashboard.html";else x.textContent=d.message||"Login failed"}catch(q){x.textContent="Server connection failed"}}</script></body></html>
